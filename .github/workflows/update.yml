name: Update casks

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-casks

jobs:
  afterhours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Point the cask at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo PunGrumpy/afterhours --json tagName -q .tagName)"
          version="${tag##*@}"
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/afterhours.rb)"
          if [[ "$version" == "$current" ]]; then
            echo "The cask is already at $version."
            exit 0
          fi
          if ! sums="$(gh release download "$tag" --repo PunGrumpy/afterhours --pattern SHA256SUMS --output -)"; then
            echo "::notice::$tag has no SHA256SUMS yet, so the next run will try again."
            exit 0
          fi
          sha="$(awk -v file="Afterhours-$version.dmg" '$2 == file { print $1 }' <<<"$sums")"
          if [[ -z "$sha" ]]; then
            echo "::notice::SHA256SUMS in $tag doesn't list Afterhours-$version.dmg yet, so the next run will try again."
            exit 0
          fi
          sed -i -e "s/^  version \".*\"$/  version \"$version\"/" -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" Casks/afterhours.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "Update Afterhours to $version"
          git push

  peony:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Point the cask at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! tag="$(gh release view --repo PunGrumpy/peony --json tagName -q .tagName)"; then
            echo "::notice::Peony has no release yet, so the next run will try again."
            exit 0
          fi
          version="${tag##*@}"
          if ! sums="$(gh release download "$tag" --repo PunGrumpy/peony --pattern SHA256SUMS --output -)"; then
            echo "::notice::$tag has no SHA256SUMS yet, so the next run will try again."
            exit 0
          fi
          sha="$(awk -v file="Peony-$version.dmg" '$2 == file { print $1 }' <<<"$sums")"
          if [[ -z "$sha" ]]; then
            echo "::notice::SHA256SUMS in $tag doesn't list Peony-$version.dmg yet, so the next run will try again."
            exit 0
          fi
          # Peony's release publishes its whole cask, so stanzas added there, such as binary, reach the tap.
          # A release published before Peony uploaded peony.rb only moves the version and checksum.
          if cask="$(gh release download "$tag" --repo PunGrumpy/peony --pattern peony.rb --output - 2>/dev/null)"; then
            if ! grep -qxF "  version \"$version\"" <<<"$cask" || ! grep -qxF "  sha256 \"$sha\"" <<<"$cask"; then
              echo "::error::peony.rb in $tag doesn't match Peony-$version.dmg in SHA256SUMS."
              exit 1
            fi
            printf '%s\n' "$cask" > Casks/peony.rb
            ruby -c Casks/peony.rb
          else
            # The checksum is compared too, since a release can be rebuilt under the same version.
            sed -i -e "s/^  version \".*\"$/  version \"$version\"/" -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" Casks/peony.rb
          fi
          if git diff --quiet; then
            echo "The cask is already at $version."
            exit 0
          fi
          git pull --rebase --autostash
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "Update Peony to $version"
          git push
